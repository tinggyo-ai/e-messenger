app = 'e-messenger'
primary_region = 'nrt'

[build]

[env]
  DB_PATH = "/app/data/nexus.sqlite"
  UPLOAD_PATH = "/app/data/uploads"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 400

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source = "e_messenger_data"
  destination = "/app/data"
